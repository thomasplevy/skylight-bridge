name: Keepalive

on:
  schedule:
    # 1st of each month, 03:00 UTC (well under GitHub's 60-day public-repo cutoff)
    - cron: "0 3 1 * *"
  workflow_dispatch:

permissions:
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          for workflow in keepalive.yml sync-lists.yml; do
            gh api -X PUT "repos/${GITHUB_REPOSITORY}/actions/workflows/${workflow}/enable"
            echo "Re-enabled ${workflow}"
          done
